<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approval Gate · live</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0 auto;
      max-width: 920px;
      padding: 28px 20px 48px;
      font: 16px/1.45 "Avenir Next", "Segoe UI", sans-serif;
      background: #efe8dc;
      color: #1c1612;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #12110f; color: #f3eee6; }
      .card, textarea, button, select { background: #1d1a16; color: inherit; }
    }
    h1 { font-family: Palatino, Georgia, serif; font-weight: 600; letter-spacing: -0.03em; }
    .muted { color: #5c5348; }
    .grid { display: grid; gap: 12px; }
    .card { background: #fffaf3; border: 1px solid #e0d5c6; border-radius: 16px; padding: 16px; }
    button, select, textarea { font: inherit; }
    button { border-radius: 999px; border: 1px solid #e0d5c6; padding: 8px 12px; cursor: pointer; }
    button.primary { background: #1d6b49; color: #f4fff8; border-color: #1d6b49; }
    textarea { width: 100%; min-height: 140px; }
    pre { overflow: auto; font-size: 13px; }
  </style>
</head>
<body>
  <p class="muted">Houghton Labs · live API · the portfolio site in <code>site/</code> is a static replay</p>
  <h1>Approval Gate</h1>
  <p class="muted" id="health">Checking the server…</p>
  <div id="scenarios" class="grid"></div>
  <section id="run" class="card" hidden>
    <h2 id="run-title"></h2>
    <dl id="fields"></dl>
    <p id="status"></p>
    <div class="grid">
      <label>Actor <input id="actor" value="ops.reviewer"></label>
      <label>Reason <input id="reason" placeholder="Required for deny"></label>
      <label>Edited arguments
        <textarea id="edited"></textarea>
      </label>
      <div>
        <button class="primary" id="approve" type="button">Approve</button>
        <button id="deny" type="button">Deny</button>
        <button id="edit" type="button">Submit edit</button>
      </div>
    </div>
    <pre id="out"></pre>
  </section>
  <script>
    var run = null;
    var health = document.getElementById("health");
    fetch("/health").then(function (r) { return r.json(); }).then(function (body) {
      health.textContent = "Provider " + body.provider + " · dataset " + body.dataset;
    });
    fetch("/v1/scenarios").then(function (r) { return r.json(); }).then(function (rows) {
      var root = document.getElementById("scenarios");
      rows.forEach(function (item) {
        var button = document.createElement("button");
        button.type = "button";
        button.textContent = item.title + " · " + item.tool;
        button.addEventListener("click", function () { start(item.id); });
        root.append(button);
      });
    });
    function start(id) {
      fetch("/v1/runs", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({scenario_id: id})
      }).then(function (r) { return r.json().then(function (body) { return {ok: r.ok, body: body}; }); })
        .then(show);
    }
    function show(payload) {
      var body = payload.body.run || payload.body;
      run = body;
      document.getElementById("run").hidden = false;
      document.getElementById("run-title").textContent = body.scenario_id + " · " + body.status;
      document.getElementById("status").textContent = body.final_answer || body.denial_reason || body.status;
      var fields = document.getElementById("fields");
      fields.replaceChildren();
      var gate = body.gate;
      if (gate) {
        document.getElementById("edited").value = JSON.stringify(gate.arguments, null, 2);
        Object.keys(gate.arguments).forEach(function (key) {
          var wrap = document.createElement("div");
          wrap.textContent = key + ": " + gate.arguments[key];
          fields.append(wrap);
        });
      }
      document.getElementById("out").textContent = JSON.stringify(payload.body, null, 2);
    }
    function decide(decision) {
      if (!run) return;
      var edited = null;
      if (decision === "edit") edited = JSON.parse(document.getElementById("edited").value);
      fetch("/v1/runs/" + run.run_id + "/decisions", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          decision: decision,
          actor: document.getElementById("actor").value,
          reason: document.getElementById("reason").value || null,
          edited_arguments: edited
        })
      }).then(function (r) { return r.json().then(function (body) { return {ok: r.ok, body: body}; }); })
        .then(show);
    }
    document.getElementById("approve").addEventListener("click", function () { decide("approve"); });
    document.getElementById("deny").addEventListener("click", function () { decide("deny"); });
    document.getElementById("edit").addEventListener("click", function () { decide("edit"); });
  </script>
</body>
</html>
